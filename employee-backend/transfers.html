<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transfers</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<script>
if (!localStorage.getItem("role")) {
    alert("You need to login first!");
    window.location.href = "login.html";
}
</script>

<h2 class="text-3xl font-bold mb-4">Transfer Records</h2>
<a href="index.html" class="px-4 py-2 bg-blue-700 text-white rounded">⬅ Back</a>

<table class="w-full mt-6 bg-white shadow rounded">
  <thead class="bg-purple-600 text-white">
    <tr>
      <th class="p-3">Employee ID</th>
      <th class="p-3">From</th>
      <th class="p-3">To</th>
    </tr>
  </thead>
  <tbody id="transferTable"></tbody>
</table>

<script>
fetch("https://payrolpro-1.onrender.com/transfers/all", {credentials:"include"})
  .then(res => res.json())
  .then(data => {
    const tbody = document.querySelector("#transferTable");
    data.forEach(t => {
      tbody.innerHTML += `
        <tr class="border-b">
          <td class="p-3">${t.employee_id}</td>
          <td class="p-3">${t.from}</td>
          <td class="p-3">${t.to}</td>
        </tr>`;
    });
  });
</script>

</body>
</html>
