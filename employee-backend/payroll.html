<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payroll</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<script>
if (!localStorage.getItem("role")) {
    alert("You need to login first!");
    window.location.href = "login.html";
}
</script>

<h2 class="text-3xl font-bold mb-4">Payroll Records</h2>
<a href="index.html" class="px-4 py-2 bg-blue-700 text-white rounded">⬅ Back</a>

<div id="payrollData" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4"></div>

<script>
fetch("https://payrolpro-1.onrender.com/payroll/all", {credentials:"include"})
  .then(res => res.json())
  .then(data => {
    const div = document.getElementById("payrollData");
    div.innerHTML = "";
    data.forEach(p => {
      div.innerHTML += `
        <div class="bg-white p-5 shadow rounded">
          <h3 class="text-xl font-bold">${p.employee_id}</h3>
          <p>Month: <strong>${p.month}</strong></p>
          <p>Net Salary: <strong>₹${p.net_salary}</strong></p>
        </div>`;
    });
  });
</script>

</body>
</html>
