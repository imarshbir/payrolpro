<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Records</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<script>
if (!localStorage.getItem("role")) {
    alert("You need to login first!");
    window.location.href = "login.html";
}
</script>

<h2 class="text-3xl font-bold mb-4">Employee Records</h2>
<a href="index.html" class="px-4 py-2 bg-blue-700 text-white rounded">⬅ Back</a>

<table class="w-full mt-6 bg-white shadow rounded">
  <thead class="bg-blue-700 text-white">
    <tr>
      <th class="p-3">Name</th>
      <th class="p-3">Email</th>
      <th class="p-3">Department</th>
      <th class="p-3">Salary</th>
      <th class="p-3">Employee ID</th>
    </tr>
  </thead>
  <tbody id="empTable"></tbody>
</table>

<script>
fetch("https://payrolpro-1.onrender.com/employees/all", {credentials:"include"})
  .then(res => res.json())
  .then(data => {
    const tbody = document.querySelector("#empTable");
    data.forEach(emp => {
      tbody.innerHTML += `
        <tr class="border-b">
          <td class="p-3">${emp.name}</td>
          <td class="p-3">${emp.email}</td>
          <td class="p-3">${emp.department}</td>
          <td class="p-3">${emp.salary}</td>
          <td class="p-3">${emp.employee_id}</td>
        </tr>`;
    });
  });
</script>

</body>
</html>
